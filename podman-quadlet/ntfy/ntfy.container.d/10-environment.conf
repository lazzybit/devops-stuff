# Drop-in for ntfy.container. Fill in the values below and start the service.
#
#   NTFY_LISTEN_HTTP   container listen address (default: :80)
#   NTFY_BASE_URL      externally visible base URL (required)
#   NTFY_AUTH_USERS    comma-separated declarative users, each formatted as
#                      <user>:<bcrypt-hash>:<role> (required)
#
# Password hashes contain "$" characters; enter them literally.
[Container]
Environment=NTFY_LISTEN_HTTP=:80
Environment=NTFY_BASE_URL=https://<domain>
Environment=NTFY_AUTH_USERS=<user>:<bcrypt-hash>:<role>
