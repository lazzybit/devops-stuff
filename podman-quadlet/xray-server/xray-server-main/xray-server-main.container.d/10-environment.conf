# Drop-in for xray-server-main.container. Fill in the values below and start the
# service.
#
#   XRAY_UUID                  VLESS UUID (required)
#   XRAY_REALITY_SERVER_NAME   REALITY TLS server name, a domain (required)
#   XRAY_LOG_LEVEL             debug | info | warning | error (optional;
#                              logging is disabled by default)
#   WARP_SOCKS_SERVER          host:port of the WARP egress proxy (optional;
#                              default xray-server-warp:1080)
#
# XRAY_PRIVATE_KEY is provided from the Podman secret and must not be set here.
[Container]
Environment=XRAY_UUID=<uuid>
Environment=XRAY_REALITY_SERVER_NAME=<domain>
# Environment=XRAY_LOG_LEVEL=warning
# Environment=WARP_SOCKS_SERVER=xray-server-warp:1080
